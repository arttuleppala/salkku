name: Hae kurssit ja julkaise
on:
  schedule:
    - cron: "20 5 * * *"
    - cron: "40 19 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: "${{ steps.d.outputs.page_url }}"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-prices.mjs
      - name: Tallenna kurssit
        run: |
          git config user.name "kurssibotti"
          git config user.email "actions@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || (git commit -m "Päivitä kurssit" && git pull --rebase -X theirs origin main && git push)
      - run: mkdir _site && cp index.html manifest.json sw.js icon.svg icon-180.png icon-192.png icon-512.png prices.json _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4
